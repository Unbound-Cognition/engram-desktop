name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build & Verify Bundle
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build debug binary
        run: swift build

      - name: Build release bundle
        run: ./scripts/make-app-bundle.sh 0.0.0-ci arm64
