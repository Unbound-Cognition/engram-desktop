name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (e.g. 0.1.0)"
        required: true
        default: "0.1.0"

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine version
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
          fi

      - name: Build and bundle Engram.app
        run: ./scripts/make-app-bundle.sh "${{ steps.vars.outputs.version }}" arm64

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          TAG="v${VERSION}"
          gh release create "$TAG" dist/Engram-${VERSION}-arm64.zip \
            --title "Engram Desktop v${VERSION}" \
            --notes "Native macOS companion for engram." \
            --draft=false \
            --prerelease=false || \
          gh release upload "$TAG" dist/Engram-${VERSION}-arm64.zip --clobber
